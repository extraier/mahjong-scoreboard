ext {
    // Play automatic protection requires minSdk >= 24 (upload fails with
    // HTTP 403 "Play automatic protection requires a minimum SDK version
    // of 24 or higher" otherwise). API 24 = Android 7.0, ~99% of devices.
    minSdkVersion = 24
    // compileSdk must be > targetSdk (skill: targetSdkVersion=1 commit bug).
    // Play requires targetSdk >= 36 from Aug 31 2026 ("Target SDK of artifact
    // is too low: 1" at commit time if below). compileSdk == targetSdk is fine
    // on modern AGP — the old compileSdk = targetSdk+1 rule is obsolete.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
}